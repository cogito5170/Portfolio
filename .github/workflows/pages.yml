name: pages
# Publishes engine/ as a static site (python3 -m worldengine site) from main only.
# Off until the repository owner turns it on: Settings → Pages → Source "GitHub Actions", then
# Settings → Secrets and variables → Actions → Variables: PAGES_ENABLED = true.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        working-directory: engine
        run: python -m worldengine site --out build/site --no-smoke
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: engine/build/site
      - id: deployment
        uses: actions/deploy-pages@v4
